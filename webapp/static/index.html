<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Team Performance Agent</title>
<script>
  // Apply the saved (or system) theme before first paint so the page never flashes.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FF5E00'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23000' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div class="app-shell">
  <!-- A slim icon rail; hovering (or tabbing into) it opens the full menu over the page. -->
  <aside class="sidebar" aria-label="Main menu">
    <div class="brand">
      <span class="brand-mark">CT</span>
      <div class="brand-text">
        <strong>Performance Agent</strong>
        <span>Cricket analytics for coaches</span>
      </div>
    </div>
    <nav class="nav" aria-label="Sections">
      <span class="nav-group"><span>Explore</span></span>
      <button class="nav-btn active" data-tab="overview" aria-current="page" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-btn" data-tab="matches" title="Matches">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="nav-label">Matches</span>
      </button>
      <button class="nav-btn" data-tab="players" title="Players">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Players</span>
      </button>
      <button class="nav-btn" data-tab="analytics" title="Player profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>
        <span class="nav-label">Player profile</span>
      </button>
      <button class="nav-btn" data-tab="compare" title="Compare players">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3L4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg>
        <span class="nav-label">Compare players</span>
      </button>

      <span class="nav-group"><span>Match day</span></span>
      <button class="nav-btn" data-tab="predictor" title="Pick my XI">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/></svg>
        <span class="nav-label">Pick my XI</span>
      </button>
      <button class="nav-btn" data-tab="upcoming" title="Upcoming matches">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        <span class="nav-label">Upcoming matches</span>
      </button>
      <button class="nav-btn" data-tab="replay" title="Replay a match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></svg>
        <span class="nav-label">Replay a match</span>
      </button>
      <button class="nav-btn" data-tab="simulate" title="Simulate a match">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span class="nav-label">Simulate a match</span>
      </button>
      <button class="nav-btn" data-tab="tournament" title="Simulate a tournament">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
        <span class="nav-label">Simulate a tournament</span>
      </button>

      <span class="nav-group"><span>AI agents</span></span>
      <button class="nav-btn" data-tab="agents" title="Ask the agents">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg>
        <span class="nav-label">Ask the agents</span>
      </button>
      <button class="nav-btn" data-tab="report" title="Selection report">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>
        <span class="nav-label">Selection report</span>
      </button>

      <span class="nav-group"><span>About</span></span>
      <button class="nav-btn" data-tab="architecture" title="How it works">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="nav-label">How it works</span>
      </button>
    </nav>
    <p class="sidebar-note" id="sidebar-dataset">Checking dataset…</p>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <h1 id="page-title">Home</h1>
        <p id="page-sub">Deterministic cricket analytics for selection decisions.</p>
      </div>
      <div class="topbar-actions">
        <span id="data-badge" class="badge" role="status" hidden></span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
          <span class="theme-toggle-label">Light</span>
        </button>
      </div>
    </header>

    <section id="tab-overview" class="tab-panel active"></section>
    <section id="tab-matches" class="tab-panel"></section>
    <section id="tab-players" class="tab-panel"></section>
    <section id="tab-upcoming" class="tab-panel"></section>
    <section id="tab-analytics" class="tab-panel"></section>
    <section id="tab-compare" class="tab-panel"></section>
    <section id="tab-replay" class="tab-panel"></section>
    <section id="tab-simulate" class="tab-panel"></section>
    <section id="tab-tournament" class="tab-panel"></section>
    <section id="tab-agents" class="tab-panel"></section>
    <section id="tab-report" class="tab-panel"></section>
    <section id="tab-predictor" class="tab-panel"></section>
    <section id="tab-architecture" class="tab-panel"></section>
  </main>
</div>
<script src="pitch3d.js"></script>
<script src="app.js"></script>
</body>
</html>
